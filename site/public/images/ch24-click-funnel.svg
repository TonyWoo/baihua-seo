<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">100 次搜索，最后去了哪儿</text>

  <text x="140" y="93" font-size="15" fill="#334155" text-anchor="end">发起搜索</text>
  <rect x="150" y="66" width="560" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="168" y="95" font-size="15" fill="#1e3a8a">100 次</text>

  <line x1="430" y1="116" x2="430" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <text x="140" y="169" font-size="15" fill="#334155" text-anchor="end">看完摘要就走</text>
  <rect x="150" y="142" width="381" height="46" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="168" y="171" font-size="15" fill="#9a3412">68 次（零点击）</text>

  <line x1="430" y1="192" x2="430" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <text x="140" y="245" font-size="15" fill="#334155" text-anchor="end">点开某个结果</text>
  <rect x="150" y="218" width="179" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="168" y="247" font-size="15" fill="#1e3a8a">32 次</text>
  <text x="345" y="247" font-size="13" fill="#64748b">再分给排在前面的几个站</text>

  <text x="400" y="322" font-size="13" fill="#64748b" text-anchor="middle">数据：Similarweb 零点击研究（2026 年 1 到 4 月）。比例为约数，不同行业出入不小。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">图书管理员的三件事：爬取、收录、排名</text>
  <text x="400" y="64" font-size="13" fill="#64748b" text-anchor="middle">顺序不能乱：没被收录的页面，连参与排名的资格都没有</text>

  <rect x="25" y="100" width="225" height="180" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="137" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">一、爬取</text>
  <text x="137" y="168" font-size="15" fill="#334155" text-anchor="middle">爬虫满世界跑</text>
  <text x="137" y="194" font-size="15" fill="#334155" text-anchor="middle">顺着链接找页面</text>
  <text x="137" y="220" font-size="15" fill="#334155" text-anchor="middle">把内容搬回机房</text>
  <text x="137" y="256" font-size="13" fill="#64748b" text-anchor="middle">好比：把新书搬进图书馆</text>

  <line x1="252" y1="190" x2="283" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="287" y="100" width="225" height="180" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="399" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">二、收录（索引）</text>
  <text x="399" y="168" font-size="15" fill="#334155" text-anchor="middle">拆解分析内容</text>
  <text x="399" y="194" font-size="15" fill="#334155" text-anchor="middle">去重、贴上标签</text>
  <text x="399" y="220" font-size="15" fill="#334155" text-anchor="middle">编进一本总目录</text>
  <text x="399" y="256" font-size="13" fill="#64748b" text-anchor="middle">好比：给书编目上架</text>

  <line x1="514" y1="190" x2="545" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="549" y="100" width="225" height="180" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="661" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">三、排名</text>
  <text x="661" y="168" font-size="15" fill="#334155" text-anchor="middle">有人搜索的那一刻</text>
  <text x="661" y="194" font-size="15" fill="#334155" text-anchor="middle">从目录里现场挑</text>
  <text x="661" y="220" font-size="15" fill="#334155" text-anchor="middle">按几百个信号排序</text>
  <text x="661" y="256" font-size="13" fill="#64748b" text-anchor="middle">好比：按问题给读者荐书</text>

  <text x="400" y="330" font-size="15" fill="#334155" text-anchor="middle">用户的一次搜索，只发生在第三步；前两步，是你平时攒下的家底</text>
  <text x="400" y="362" font-size="13" fill="#64748b" text-anchor="middle">页面没流量先别慌着改内容，先确认它走到了第几步</text>
</svg>

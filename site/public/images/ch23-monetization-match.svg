<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">四种变现，各自最搭哪种流量</text>
  <rect x="40" y="104" width="720" height="64" fill="#f5f8ff"/>
  <rect x="40" y="232" width="720" height="64" fill="#f5f8ff"/>
  <rect x="40" y="64" width="720" height="296" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="64" width="720" height="40" fill="#2563eb"/>
  <line x1="190" y1="64" x2="190" y2="360" stroke="#64748b" stroke-width="1"/>
  <line x1="470" y1="64" x2="470" y2="360" stroke="#64748b" stroke-width="1"/>
  <line x1="40" y1="104" x2="760" y2="104" stroke="#64748b" stroke-width="1"/>
  <line x1="40" y1="168" x2="760" y2="168" stroke="#64748b" stroke-width="1"/>
  <line x1="40" y1="232" x2="760" y2="232" stroke="#64748b" stroke-width="1"/>
  <line x1="40" y1="296" x2="760" y2="296" stroke="#64748b" stroke-width="1"/>
  <text x="56" y="90" font-size="15" font-weight="bold" fill="#ffffff">变现方式</text>
  <text x="206" y="90" font-size="15" font-weight="bold" fill="#ffffff">最搭的流量</text>
  <text x="486" y="90" font-size="15" font-weight="bold" fill="#ffffff">一句提醒</text>
  <text x="56" y="144" font-size="15" fill="#334155">广告</text>
  <text x="206" y="144" font-size="15" fill="#334155">量大而杂的搜索流量</text>
  <text x="486" y="144" font-size="15" fill="#334155">别贴着下载按钮，误点招处罚</text>
  <text x="56" y="208" font-size="15" fill="#334155">付费版</text>
  <text x="206" y="208" font-size="15" fill="#334155">高频使用的老用户</text>
  <text x="486" y="208" font-size="15" fill="#334155">免费版别砍太狠，先把人留住</text>
  <text x="56" y="272" font-size="15" fill="#334155">订阅</text>
  <text x="206" y="272" font-size="15" fill="#334155">需求稳定、长期要用的人</text>
  <text x="486" y="272" font-size="15" fill="#334155">先确认真有人愿意月月付</text>
  <text x="56" y="336" font-size="15" fill="#334155">联盟佣金</text>
  <text x="206" y="336" font-size="15" fill="#334155">正在比产品、查评测的流量</text>
  <text x="486" y="336" font-size="15" fill="#334155">只推自己真用过的东西</text>
  <text x="400" y="396" font-size="13" fill="#ea580c" text-anchor="middle">搭配原则：广告先保底，付费版再把单个用户的价值抬上去。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif">
  <defs>
    <marker id="arr30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#f5f8ff"/>
  <text x="30" y="42" font-size="20" fill="#2563eb" font-weight="bold">提示词监测土办法：一张表，一周一跑</text>
  <rect x="20" y="96" width="136" height="118" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="88" y="126" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">1. 定问题</text>
  <text x="88" y="154" font-size="13" fill="#64748b" text-anchor="middle">约 30 条</text>
  <text x="88" y="178" font-size="13" fill="#64748b" text-anchor="middle">用户真实问法</text>
  <rect x="176" y="96" width="136" height="118" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="244" y="126" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">2. 分引擎问</text>
  <text x="244" y="154" font-size="13" fill="#64748b" text-anchor="middle">三个引擎</text>
  <text x="244" y="178" font-size="13" fill="#64748b" text-anchor="middle">各问一遍</text>
  <rect x="332" y="96" width="136" height="118" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="126" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">3. 记四列</text>
  <text x="400" y="154" font-size="13" fill="#64748b" text-anchor="middle">提没提、引没引</text>
  <text x="400" y="178" font-size="13" fill="#64748b" text-anchor="middle">引的哪一页</text>
  <rect x="488" y="96" width="136" height="118" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="556" y="126" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">4. 算比例</text>
  <text x="556" y="154" font-size="13" fill="#64748b" text-anchor="middle">提及率</text>
  <text x="556" y="178" font-size="13" fill="#64748b" text-anchor="middle">引用份额</text>
  <rect x="644" y="96" width="136" height="118" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="712" y="126" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">5. 看趋势</text>
  <text x="712" y="154" font-size="13" fill="#64748b" text-anchor="middle">攒够 8 周</text>
  <text x="712" y="178" font-size="13" fill="#64748b" text-anchor="middle">再下结论</text>
  <line x1="158" y1="155" x2="172" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr30)"/>
  <line x1="314" y1="155" x2="328" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr30)"/>
  <line x1="470" y1="155" x2="484" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr30)"/>
  <line x1="626" y1="155" x2="640" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr30)"/>
  <text x="30" y="262" font-size="15" fill="#334155">固定问题、固定时间、固定记录格式。AI 的回答有随机性，</text>
  <text x="30" y="288" font-size="15" fill="#334155">单日波动不算数，<tspan fill="#ea580c" font-weight="bold">趋势才算数</tspan>。</text>
</svg>

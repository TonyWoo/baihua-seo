  <line x1="400" y1="102" x2="400" y2="124" stroke="#2563eb" stroke-width="2"/>
  <line x1="150" y1="124" x2="650" y2="124" stroke="#2563eb" stroke-width="2"/>
  <line x1="150" y1="124" x2="150" y2="146" stroke="#2563eb" stroke-width="2"/>

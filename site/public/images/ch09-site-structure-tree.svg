  <text x="735" y="264" text-anchor="middle" font-size="15" fill="#1f2937">格式区别对比</text>
  <text x="735" y="282" text-anchor="middle" font-size="11" fill="#64748b">/blog/vs/</text>

  <rect x="40" y="322" width="720" height="88" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="350" font-size="15" font-weight="bold" fill="#1e40af">读图要点</text>
  <text x="60" y="376" font-size="13" fill="#334155">每个方框是一个独立网址：分类页负责领路，工具页负责干活，教程页负责引流。</text>
  <text x="60" y="398" font-size="13" fill="#334155">重要页面别埋过<tspan fill="#ea580c" font-weight="bold">第 3 层</tspan>：越深，爬虫来得越少，用户也越难找到。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#f5f8ff"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">网站结构树：三层之内，各就各位</text>

  <rect x="320" y="56" width="160" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

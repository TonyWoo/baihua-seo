  <rect x="310" y="146" width="180" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-size="15" fill="#1f2937">转换工具 /convert/</text>
  <rect x="560" y="146" width="180" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="650" y="175" text-anchor="middle" font-size="15" fill="#1f2937">教程博客 /blog/</text>

  <line x1="150" y1="192" x2="150" y2="218" stroke="#2563eb" stroke-width="2"/>
  <line x1="90" y1="218" x2="210" y2="218" stroke="#2563eb" stroke-width="2"/>
  <line x1="90" y1="218" x2="90" y2="242" stroke="#2563eb" stroke-width="2"/>
  <line x1="210" y1="218" x2="210" y2="242" stroke="#2563eb" stroke-width="2"/>
  <line x1="400" y1="192" x2="400" y2="218" stroke="#2563eb" stroke-width="2"/>
  <line x1="345" y1="218" x2="475" y2="218" stroke="#2563eb" stroke-width="2"/>
  <line x1="345" y1="218" x2="345" y2="242" stroke="#2563eb" stroke-width="2"/>
  <line x1="475" y1="218" x2="475" y2="242" stroke="#2563eb" stroke-width="2"/>
  <line x1="650" y1="192" x2="650" y2="218" stroke="#2563eb" stroke-width="2"/>
  <line x1="615" y1="218" x2="735" y2="218" stroke="#2563eb" stroke-width="2"/>
  <line x1="615" y1="218" x2="615" y2="242" stroke="#2563eb" stroke-width="2"/>
  <line x1="735" y1="218" x2="735" y2="242" stroke="#2563eb" stroke-width="2"/>

  <rect x="30" y="242" width="120" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="264" text-anchor="middle" font-size="15" fill="#1f2937">压缩 PNG</text>
  <text x="90" y="282" text-anchor="middle" font-size="11" fill="#64748b">/compress-png/</text>
  <rect x="150" y="242" width="120" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="264" text-anchor="middle" font-size="15" fill="#1f2937">压缩 JPG</text>
  <text x="210" y="282" text-anchor="middle" font-size="11" fill="#64748b">/compress-jpg/</text>
  <rect x="285" y="242" width="120" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="264" text-anchor="middle" font-size="15" fill="#1f2937">JPG 转 PNG</text>
  <text x="345" y="282" text-anchor="middle" font-size="11" fill="#64748b">/jpg-to-png/</text>
  <rect x="415" y="242" width="120" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="475" y="264" text-anchor="middle" font-size="15" fill="#1f2937">PNG 转 JPG</text>
  <text x="475" y="282" text-anchor="middle" font-size="11" fill="#64748b">/png-to-jpg/</text>
  <rect x="555" y="242" width="120" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

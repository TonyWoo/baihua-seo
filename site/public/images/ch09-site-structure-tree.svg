  <line x1="650" y1="124" x2="650" y2="146" stroke="#2563eb" stroke-width="2"/>

  <rect x="60" y="146" width="180" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="380" fill="#f5f8ff"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">先数一数：第一页都是些什么页面</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#64748b">示例：一个工具类关键词的第一页构成</text>
  <text x="176" y="117" text-anchor="end" font-size="15" fill="#1e293b">工具页</text>
  <rect x="192" y="92" width="456" height="38" rx="6" fill="#ea580c"/>
  <text x="660" y="117" font-size="15" font-weight="bold" fill="#ea580c">6 个</text>
  <text x="176" y="173" text-anchor="end" font-size="15" fill="#1e293b">教程文章</text>
  <rect x="192" y="148" width="152" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="356" y="173" font-size="15" fill="#334155">2 个</text>
  <text x="176" y="229" text-anchor="end" font-size="15" fill="#1e293b">视频</text>
  <rect x="192" y="204" width="76" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="229" font-size="15" fill="#334155">1 个</text>
  <text x="176" y="285" text-anchor="end" font-size="15" fill="#1e293b">问答帖</text>
  <rect x="192" y="260" width="76" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="285" font-size="15" fill="#334155">1 个</text>
  <text x="400" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#ea580c">哪种形态占多数，就先做哪种形态的页面</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="430" fill="#f5f8ff"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">一条搜索结果的解剖：三行各管一件事</text>

  <rect x="60" y="64" width="680" height="168" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="96" cy="100" r="13" fill="#2563eb"/>
  <text x="96" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">A</text>
  <text x="122" y="94" font-size="14" fill="#1f2937">阿哲的工具站</text>
  <text x="122" y="116" font-size="12" fill="#64748b">azhetools.example › compress › compress-png</text>
  <circle cx="712" cy="100" r="11" fill="#ea580c"/>
  <text x="712" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>

  <text x="88" y="154" font-size="19" fill="#2563eb">Compress PNG Images Online, Free &amp; No Sign Up</text>
  <circle cx="712" cy="146" r="11" fill="#ea580c"/>
  <text x="712" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>

  <text x="88" y="184" font-size="13" fill="#475569">Reduce PNG file size without losing quality. Batch compression,</text>
  <text x="88" y="204" font-size="13" fill="#475569">no sign-up required. Files are deleted right after processing.</text>
  <circle cx="712" cy="190" r="11" fill="#ea580c"/>
  <text x="712" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>

  <rect x="60" y="258" width="680" height="140" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="84" y="288" font-size="15" font-weight="bold" fill="#1e40af">三行分别由谁决定</text>
  <text x="84" y="318" font-size="14" fill="#334155"><tspan fill="#ea580c" font-weight="bold">1</tspan> 网址与面包屑：来自网址结构和站内层级，告诉用户这页在店里的位置</text>
  <text x="84" y="346" font-size="14" fill="#334155"><tspan fill="#ea580c" font-weight="bold">2</tspan> 标题：来自页面的 title，是全页最贵的一句话，决定排哪个词</text>
  <text x="84" y="374" font-size="14" fill="#334155"><tspan fill="#ea580c" font-weight="bold">3</tspan> 描述：来自页面的 description，不定排名，定点击，是写给人看的广告语</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#f5f8ff"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">关键词内耗：自己人抢自己人</text>
  <line x1="400" y1="58" x2="400" y2="318" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="205" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">三个页面，抢同一个词</text>
  <rect x="40" y="100" width="150" height="42" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="126" text-anchor="middle" font-size="14" fill="#1e293b">压缩 PNG 页</text>
  <rect x="40" y="158" width="150" height="42" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="184" text-anchor="middle" font-size="14" fill="#1e293b">PNG 压缩器页</text>
  <rect x="40" y="216" width="150" height="42" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="242" text-anchor="middle" font-size="14" fill="#1e293b">减小 PNG 页</text>
  <rect x="252" y="156" width="118" height="46" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="311" y="176" text-anchor="middle" font-size="14" fill="#1e293b">同一个词</text>
  <text x="311" y="194" text-anchor="middle" font-size="11" fill="#64748b">compress png</text>
  <line x1="190" y1="121" x2="248" y2="166" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <line x1="190" y1="179" x2="248" y2="179" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <line x1="190" y1="237" x2="248" y2="192" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="205" y="302" text-anchor="middle" font-size="13" fill="#ea580c">权重被摊薄，谁都排不上去</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">合并之后：一页吃下这个词</text>
  <rect x="445" y="92" width="150" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="520" y="114" text-anchor="middle" font-size="13" fill="#64748b">旧页 A 已跳转</text>
  <rect x="445" y="226" width="150" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="520" y="248" text-anchor="middle" font-size="13" fill="#64748b">旧页 B 已跳转</text>
  <rect x="445" y="146" width="150" height="52" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="520" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">合并后的页面</text>
  <line x1="520" y1="126" x2="520" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="226" x2="520" y2="202" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="595" y1="172" x2="644" y2="172" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="648" y="149" width="118" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="707" y="169" text-anchor="middle" font-size="14" fill="#1e293b">同一个词</text>
  <text x="707" y="187" text-anchor="middle" font-size="11" fill="#ea580c">稳居前列</text>
  <text x="600" y="302" text-anchor="middle" font-size="13" fill="#334155">内容合并，旧页面的链接全指过来</text>
  <text x="400" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">一个意图，只留一个主力页面</text>
</svg>

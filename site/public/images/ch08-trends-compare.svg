<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">单看一个词没用，要和标杆词比量级</text>
  <line x1="80" y1="320" x2="740" y2="320" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="320" x2="80" y2="80" stroke="#64748b" stroke-width="2"/>
  <path d="M 90 160 C 250 142, 450 156, 730 146" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <text x="590" y="118" font-size="14" fill="#64748b" text-anchor="middle">标杆词：常年有人搜的老词</text>
  <path d="M 90 300 C 200 295, 280 301, 340 298 C 380 296, 395 182, 412 176 C 430 182, 448 294, 520 292 C 600 290, 680 296, 730 294" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="185" y="276" font-size="14" fill="#2563eb" text-anchor="middle">候选词：平时趴在地上</text>
  <line x1="408" y1="176" x2="408" y2="152" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="545" y="170" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">它的尖峰，也够不到标杆的日常水位</text>
  <text x="400" y="382" font-size="14" fill="#334155" text-anchor="middle">Trends 的纵轴是相对分 0 到 100：没有参照物，100 分什么都不是</text>

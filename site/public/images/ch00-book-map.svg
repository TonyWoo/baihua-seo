<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="520" fill="#f5f8ff"/>
  <text x="400" y="40" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">这本书的路线图：七篇是一条路</text>
  <text x="400" y="66" font-size="13" fill="#64748b" text-anchor="middle">先懂原理，再动手做，最后应对 AI 搜索</text>

  <circle cx="60" cy="115" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="121" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>
  <rect x="92" y="92" width="640" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="121" font-size="15" fill="#334155">第一篇 原理（第 1～3 章）：先弄懂搜索引擎在想什么</text>
  <line x1="60" y1="130" x2="60" y2="146" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="173" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="179" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text>
  <rect x="92" y="150" width="640" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="179" font-size="15" fill="#334155">第二篇 选词（第 4～8 章）：先选对词，再谈努力</text>
  <line x1="60" y1="188" x2="60" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="231" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="237" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text>
  <rect x="92" y="208" width="640" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="237" font-size="15" fill="#334155">第三篇 建站（第 9～13 章）：把网站的地基打对</text>
  <line x1="60" y1="246" x2="60" y2="262" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="289" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="295" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text>
  <rect x="92" y="266" width="640" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="295" font-size="15" fill="#334155">第四篇 内容（第 14～17 章）：写能排上去的内容</text>
  <line x1="60" y1="304" x2="60" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="347" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="353" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">5</text>
  <rect x="92" y="324" width="640" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="353" font-size="15" fill="#334155">第五篇 外链（第 18～20 章）：让别人替你说话</text>
  <line x1="60" y1="362" x2="60" y2="378" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="405" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="411" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">6</text>
  <rect x="92" y="382" width="640" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="112" y="411" font-size="15" fill="#334155">第六篇 数据与变现（第 21～23 章）：看数据过日子，把流量变钱</text>
  <line x1="60" y1="420" x2="60" y2="436" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="463" r="15" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="469" font-size="15" font-weight="bold" fill="#ea580c" text-anchor="middle">7</text>
  <rect x="92" y="440" width="640" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="112" y="469" font-size="15" font-weight="bold" fill="#ea580c">第七篇 GEO（第 24～31 章）：AI 搜索时代的新打法</text>

  <text x="400" y="512" font-size="13" fill="#64748b" text-anchor="middle">每一篇都承接上一篇：没有前面的地基，后面的招式都使不出来</text>
</svg>

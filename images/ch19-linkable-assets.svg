<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#f5f8ff"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" fill="#2563eb">先给价值，再收链接</text>

  <rect x="40" y="90" width="230" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">免费小工具</text>
  <text x="155" y="140" text-anchor="middle" font-size="13" fill="#64748b">解决一个高频小麻烦</text>

  <rect x="40" y="180" width="230" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">行业小数据</text>
  <text x="155" y="230" text-anchor="middle" font-size="13" fill="#64748b">别人写文章正缺的论据</text>

  <rect x="40" y="270" width="230" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">免费资源包</text>
  <text x="155" y="320" text-anchor="middle" font-size="13" fill="#64748b">模板清单，拿走就能用</text>

  <path d="M270,123 C300,140 306,168 326,192" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M270,213 L326,213" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M270,303 C300,286 306,258 326,234" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="330" y="168" width="170" height="104" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="415" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">引用者</text>
  <text x="415" y="226" text-anchor="middle" font-size="13" fill="#64748b">博主、媒体、资源页</text>
  <text x="415" y="248" text-anchor="middle" font-size="13" fill="#64748b">用得上，才会链</text>

  <path d="M500,220 L562,220" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/>
  <text x="533" y="200" text-anchor="middle" font-size="13" fill="#ea580c">引用时附链接</text>

  <rect x="570" y="168" width="190" height="104" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="665" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">你的站</text>
  <text x="665" y="226" text-anchor="middle" font-size="13" fill="#64748b">收到正经外链</text>
  <text x="665" y="248" text-anchor="middle" font-size="13" fill="#64748b">一条一条，越攒越多</text>

  <text x="400" y="374" text-anchor="middle" font-size="13" fill="#64748b">顺序不能反：先有值得引用的东西，链接是随后来的回报</text>
</svg>

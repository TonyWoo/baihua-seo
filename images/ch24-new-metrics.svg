<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">仪表盘要换新指标了</text>

  <rect x="50" y="70" width="330" height="200" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="215" y="106" font-size="15" font-weight="bold" fill="#64748b" text-anchor="middle">旧账本</text>
  <text x="215" y="146" font-size="15" fill="#334155" text-anchor="middle">平均排名</text>
  <text x="215" y="180" font-size="15" fill="#334155" text-anchor="middle">点击量</text>
  <text x="215" y="214" font-size="15" fill="#334155" text-anchor="middle">会话数</text>
  <text x="215" y="248" font-size="13" fill="#64748b" text-anchor="middle">还在看，但只看这些会误判</text>

  <line x1="386" y1="170" x2="414" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="70" width="330" height="200" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="585" y="106" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">新账本</text>
  <text x="585" y="146" font-size="15" fill="#1e3a8a" text-anchor="middle">被 AI 引用次数</text>
  <text x="585" y="180" font-size="15" fill="#1e3a8a" text-anchor="middle">品牌词搜索量</text>
  <text x="585" y="214" font-size="15" fill="#1e3a8a" text-anchor="middle">直接访问量</text>
  <text x="585" y="248" font-size="13" fill="#64748b" text-anchor="middle">先被记住，再被找上门</text>

  <text x="400" y="318" font-size="13" fill="#64748b" text-anchor="middle">点击没有消失，只是从唯一指标，变成指标之一。</text>
</svg>

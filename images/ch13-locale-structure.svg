<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#f5f8ff"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">多语言的三种放法：先看养得起哪种</text>

  <rect x="30" y="64" width="240" height="272" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">子目录</text>
  <text x="150" y="118" text-anchor="middle" font-size="13" fill="#2563eb">example.com/es/</text>
  <rect x="95" y="134" width="110" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="154" text-anchor="middle" font-size="12" fill="#1f2937">主域名</text>
  <line x1="150" y1="164" x2="150" y2="176" stroke="#2563eb" stroke-width="2"/>
  <line x1="100" y1="176" x2="200" y2="176" stroke="#2563eb" stroke-width="2"/>
  <line x1="100" y1="176" x2="100" y2="182" stroke="#2563eb" stroke-width="2"/>
  <line x1="200" y1="176" x2="200" y2="182" stroke="#2563eb" stroke-width="2"/>
  <rect x="52" y="182" width="96" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="200" text-anchor="middle" font-size="12" fill="#334155">西语版 /es/</text>
  <rect x="152" y="182" width="96" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#334155">葡语版 /pt/</text>
  <text x="150" y="234" text-anchor="middle" font-size="12" fill="#64748b">同一棵树上长新枝</text>
  <text x="48" y="262" font-size="13" fill="#334155">权重：全攒在一个域名</text>
  <text x="48" y="288" font-size="13" fill="#334155">维护：一套程序一份心</text>
  <text x="48" y="314" font-size="13" fill="#334155">适合：独立开发者的默认选</text>

  <rect x="280" y="64" width="240" height="272" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">子域名</text>
  <text x="400" y="118" text-anchor="middle" font-size="13" fill="#64748b">es.example.com</text>
  <rect x="345" y="134" width="110" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="154" text-anchor="middle" font-size="12" fill="#1f2937">主域名</text>
  <line x1="400" y1="164" x2="400" y2="176" stroke="#64748b" stroke-width="2"/>
  <line x1="350" y1="176" x2="450" y2="176" stroke="#64748b" stroke-width="2"/>
  <line x1="350" y1="176" x2="350" y2="182" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="176" x2="450" y2="182" stroke="#64748b" stroke-width="2"/>
  <rect x="302" y="182" width="96" height="28" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="12" fill="#334155">es. 子域名</text>
  <rect x="402" y="182" width="96" height="28" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#334155">pt. 子域名</text>
  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#64748b">主树旁分出的半独立枝</text>
  <text x="298" y="262" font-size="13" fill="#334155">权重：与主域部分共享</text>
  <text x="298" y="288" font-size="13" fill="#334155">维护：配置略多，居中</text>
  <text x="298" y="314" font-size="13" fill="#334155">适合：想半独立运营时</text>

  <rect x="530" y="64" width="240" height="272" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="650" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">独立域名</text>
  <text x="650" y="118" text-anchor="middle" font-size="13" fill="#64748b">example.es</text>
  <rect x="595" y="134" width="110" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="650" y="154" text-anchor="middle" font-size="12" fill="#1f2937">同一品牌</text>
  <line x1="650" y1="164" x2="650" y2="176" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="176" x2="700" y2="176" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="176" x2="600" y2="182" stroke="#64748b" stroke-width="2"/>
  <line x1="700" y1="176" x2="700" y2="182" stroke="#64748b" stroke-width="2"/>
  <rect x="552" y="182" width="96" height="28" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-size="12" fill="#334155">独立 .es 站</text>
  <rect x="652" y="182" width="96" height="28" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="700" y="200" text-anchor="middle" font-size="12" fill="#334155">独立 .br 站</text>
  <text x="650" y="234" text-anchor="middle" font-size="12" fill="#64748b">每门语言各栽一棵树</text>
  <text x="548" y="262" font-size="13" fill="#334155">权重：每个域名从零攒</text>
  <text x="548" y="288" font-size="13" fill="#334155">维护：成本最高，逐个养</text>
  <text x="548" y="314" font-size="13" fill="#334155">适合：长期扎根当地市场</text>

  <text x="400" y="384" text-anchor="middle" font-size="13" fill="#64748b">没有绝对优劣：先数自己养得起几个站，再谈结构。</text>
  <text x="400" y="408" text-anchor="middle" font-size="13" fill="#64748b">本书主角的选择是子目录：权重集中，维护一套。</text>
</svg>

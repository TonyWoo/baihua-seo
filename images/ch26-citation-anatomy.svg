<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">一段容易被引用的文字，拆开看</text>

  <rect x="40" y="70" width="430" height="240" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <rect x="48" y="90" width="5" height="28" fill="#2563eb"/>
  <text x="64" y="110" font-size="15" font-weight="bold" fill="#1e3a8a">先给结论：日常截图转 WebP 最划算。</text>

  <rect x="48" y="130" width="5" height="50" fill="#ea580c"/>
  <text x="64" y="150" font-size="15" fill="#334155">实测 200 张截图，平均从 1.8MB</text>
  <text x="64" y="172" font-size="15" fill="#334155">降到 0.9MB，耗时不到 3 秒。</text>

  <rect x="48" y="192" width="5" height="50" fill="#64748b"/>
  <text x="64" y="212" font-size="15" fill="#334155">浏览器官方文档也提醒：“格式选</text>
  <text x="64" y="234" font-size="15" fill="#334155">对，往往比调参数更省体积。”</text>

  <rect x="48" y="254" width="5" height="28" fill="#64748b"/>
  <text x="64" y="274" font-size="15" fill="#334155">数据来源：本站 2026 年 9 月实测记录。</text>

  <line x1="470" y1="104" x2="500" y2="104" stroke="#64748b" stroke-width="2"/>
  <text x="510" y="100" font-size="15" font-weight="bold" fill="#2563eb">结论</text>
  <text x="510" y="122" font-size="13" fill="#64748b">一句话先把答案给全</text>

  <line x1="470" y1="155" x2="500" y2="155" stroke="#64748b" stroke-width="2"/>
  <text x="510" y="151" font-size="15" font-weight="bold" fill="#ea580c">数据</text>
  <text x="510" y="173" font-size="13" fill="#64748b">数字带单位、带样本量</text>

  <line x1="470" y1="213" x2="500" y2="213" stroke="#64748b" stroke-width="2"/>
  <text x="510" y="209" font-size="15" font-weight="bold" fill="#64748b">引言与出处</text>
  <text x="510" y="231" font-size="13" fill="#64748b">借权威的话，标清来路</text>

  <text x="400" y="356" font-size="13" fill="#64748b" text-anchor="middle">AI 摘走一段时，结论、证据、出处一起被搬走，可信度也一起过户。</text>
</svg>

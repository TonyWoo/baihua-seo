<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AI 回答问题，要过三道关</text>

  <rect x="20" y="86" width="160" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="120" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">用户提问</text>
  <text x="100" y="146" font-size="13" fill="#64748b" text-anchor="middle">一句问题</text>
  <text x="100" y="206" font-size="13" fill="#64748b" text-anchor="middle">问题会被改写扩展</text>

  <line x1="184" y1="128" x2="216" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="86" width="160" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="120" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">检索候选</text>
  <text x="300" y="146" font-size="13" fill="#64748b" text-anchor="middle">先抱回一摞页面</text>
  <text x="300" y="206" font-size="13" fill="#64748b" text-anchor="middle">排名决定进不进池子</text>

  <line x1="384" y1="128" x2="416" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="86" width="160" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="120" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">拼装答案</text>
  <text x="500" y="146" font-size="13" fill="#64748b" text-anchor="middle">摘段落拼成回答</text>
  <text x="500" y="206" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">段落决定出不出线</text>

  <line x1="584" y1="128" x2="616" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="86" width="160" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="120" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">标注引用</text>
  <text x="700" y="146" font-size="13" fill="#64748b" text-anchor="middle">用到的页面挂名</text>
  <text x="700" y="206" font-size="13" fill="#64748b" text-anchor="middle">你的名字出现在这里</text>

  <text x="400" y="272" font-size="13" fill="#64748b" text-anchor="middle">传统搜索比的是哪页排前面，AI 比的是哪段能直接用。</text>
</svg>

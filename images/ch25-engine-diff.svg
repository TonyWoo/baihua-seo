<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <rect width="800" height="380" fill="#f5f8ff"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">引用来自谷歌前十的比例，各家差很远</text>

  <text x="195" y="114" font-size="15" fill="#334155" text-anchor="end">谷歌 AI Mode</text>
  <rect x="210" y="88" width="432" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="656" y="114" font-size="15" fill="#1e3a8a">约 90%</text>

  <text x="195" y="184" font-size="15" fill="#334155" text-anchor="end">Perplexity</text>
  <rect x="210" y="158" width="432" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="656" y="184" font-size="15" fill="#1e3a8a">约 90%</text>

  <text x="195" y="254" font-size="15" fill="#334155" text-anchor="end">ChatGPT</text>
  <rect x="210" y="228" width="144" height="38" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="368" y="254" font-size="15" fill="#9a3412">约 30%</text>

  <text x="210" y="300" font-size="13" fill="#64748b">0%</text>
  <text x="690" y="300" font-size="13" fill="#64748b" text-anchor="end">100%</text>

  <text x="400" y="342" font-size="13" fill="#64748b" text-anchor="middle">数据：CiteLens 引用基准（2026）。ChatGPT 的引用名单，和谷歌排名的相关性明显更低。</text>
</svg>
